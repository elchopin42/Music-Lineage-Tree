<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Musical Lineage Tree</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f8f9fa; }
        header { background: #2c3e50; color: white; padding: 15px; text-align: center; }
        #controls { padding: 15px; display: flex; justify-content: center; background: #ffffff; border-bottom: 1px solid #dee2e6; }
        select { padding: 10px; font-size: 16px; width: 400px; border-radius: 5px; border: 1px solid #ccc; cursor: pointer; }
        #mynetwork { width: 100%; height: calc(100vh - 160px); background: white; }
    </style>
</head>
<body>

<header><h1>Musical Lineage Tree</h1></header>
<div id="controls">
    <select id="search"><option value="">Carregant base de dades...</option></select>
</div>
<div id="mynetwork"></div>

<script>
let network = null;
let fullData = {};

// Càrrega del CSV
Papa.parse("dades.csv", {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
        processData(results.data);
    }
});

function processData(data) {
    const select = document.getElementById('search');
    select.innerHTML = '<option value="">-- Selecciona un compositor --</option>';

    // Guardem les dades en un objecte per accés ràpid
    data.forEach(row => {
        fullData[row.ID_CODE] = {
            ...row,
            teachers: row.STUDENT_OF ? row.STUDENT_OF.split(',').map(s => s.trim()).filter(s => s !== "") : []
        };
    });

    // Ordenem la llista del cercador segons la columna SORT_NAME (o cognom)
    data.sort((a, b) => {
        const nameA = (a.SORT_NAME || a.SURNAME || "").toLowerCase().replace(/^(de la |de |von |van |d'|da )/, "");
        const nameB = (b.SORT_NAME || b.SURNAME || "").toLowerCase().replace(/^(de la |de |von |van |d'|da )/, "");
        return nameA.localeCompare(nameB);
    }).forEach(row => {
        const opt = document.createElement('option');
        opt.value = row.ID_CODE;
        // Mostrem el nom ordenat al menú (Ex: Falla, Manuel)
        opt.textContent = row.SORT_NAME ? row.SORT_NAME : `${row.SURNAME}, ${row.NAME}`;
        select.appendChild(opt);
    });

    select.addEventListener('change', (e) => drawTree(e.target.value));
    
    // Per defecte obrim Pedrell si existeix
    if (fullData['f_pedrell']) {
        select.value = 'f_pedrell';
        drawTree('f_pedrell');
    }
}

function drawTree(rootId) {
    if (!rootId || !fullData[rootId]) return;

    const nodes = [];
    const edges = [];
    const focus = fullData[rootId];

    // --- FUNCIÓ INTERNA MILLORADA PER CREAR NODES AMB IMATGE ---
    function createCustomNode(id, level, hasMoreUp, hasMoreDown) {
        const c = fullData[id];
        
        // Criteris de color (mantenim els mateixos)
        const bgColor = level === 0 ? '#e6f7ff' : (level < 0 ? '#fff7e6' : '#f6ffed');
        const borderColor = level === 0 ? '#1890ff' : '#999';
        
        // Estil de la vora (puntejada si hi ha "més enllà")
        const borderDashes = (hasMoreUp || hasMoreDown) ? [5, 5] : false;

        // --- CONSTRUCCIÓ DE L'ETIQUETA (LABEL) SENSE EL CODI <img> ---
        // Decidim el títol principal (Nom artístic o Real)
        const displayTitle = c.DISPLAY_NAME ? c.DISPLAY_NAME : `${c.NAME} ${c.SURNAME}`;
        
        // Si el nom real és diferent, el posem en petit a sota
        const realNameSub = (c.DISPLAY_NAME && c.SURNAME && c.DISPLAY_NAME !== (c.NAME + " " + c.SURNAME)) 
                            ? `\n(${c.NAME} ${c.SURNAME})` : "";

        // Construïm la etiqueta neta
        const cleanLabel = `${displayTitle}${realNameSub}\n` +
                           `${c.BIRTH_PLACE || ''} (${c.BIRTH_YEAR || '?'})\n` +
                           `${c.DEATH_PLACE || ''} (${c.DEATH_YEAR || '?'})`;

        // --- GESTIÓ DE LA IMATGE DE LA BANDERA ---
        // Usem la bandera de naixement com a imatge del node (o la de mort si no n'hi ha)
        // Recorda que el codi ja assumeix que la carpeta és "flags" (en minúscules)
        // I que els fitxers de l'Excel (Ex: "ES") s'han de dir "es.png" a la carpeta.
        let nodeImage = null;
        if (c.BIRTH_FLAG) {
            nodeImage = `flags/${c.BIRTH_FLAG.toLowerCase()}.png`;
        } else if (c.DEATH_FLAG) {
            nodeImage = `flags/${c.DEATH_FLAG.toLowerCase()}.png`;
        }
        
        // Si no hi ha cap bandera, podem posar una imatge per defecte (opcional)
        // nodeImage = nodeImage || 'flags/default.png';

        // --- RETORNEM L'OBJECTE NODE AMB L'ESTIL "IMATGE" ---
        return {
            id: id,
            label: cleanLabel,
            level: level,
            
            // --- CANVI CLAU AQUÍ ---
            shape: nodeImage ? 'image' : 'box', // Si hi ha imatge, usem tipus 'image'
            image: nodeImage,                     // Ruta a la imatge
            
            // Configuració visual
            size: 30, // Mida de la imatge de la bandera
            color: { 
                background: bgColor, 
                border: borderColor,
                highlight: { background: '#d0e9ff', border: '#1890ff' }
            },
            shapeProperties: { 
                borderDashes: borderDashes,
                useBorderWithImage: true // Dibuixa la caixa de color al voltant de la imatge
            },
            font: { 
                size: 14, 
                face: 'Segoe UI', 
                align: 'center',
                vadjust: 5 // Ajusta la posició del text sota la imatge
            },
            margin: 10
        };
    }
    // --- FI DE LA FUNCIÓ INTERNA MILLORADA ---


    // 1. NODE CENTRAL
    nodes.push(createCustomNode(rootId, 0, false, false));

    // 2. MESTRES DIRECTES (A dalt, nivell -1)
    focus.teachers.forEach(tId => {
        if (fullData[tId]) {
            // Té el mestre, al seu torn, més mestres? (per a la vora puntejada)
            const hasMoreUp = fullData[tId].teachers.length > 0;
            nodes.push(createCustomNode(tId, -1, hasMoreUp, false));
            edges.push({ from: tId, to: rootId, arrows: 'to', color: '#fa8c16', width: 2 });
        }
    });

    // 3. ALUMNES DIRECTES (A baix, nivell 1)
    Object.keys(fullData).forEach(sId => {
        const student = fullData[sId];
        if (student.teachers.includes(rootId)) {
            // Té l'alumne, al seu torn, més alumnes? (per a la vora puntejada)
            const hasMoreDown = Object.values(fullData).some(anyS => anyS.teachers.includes(sId));
            nodes.push(createCustomNode(sId, 1, false, hasMoreDown));
            edges.push({ from: rootId, to: sId, arrows: 'to', color: '#52c41a', width: 2 });
        }
    });

    // --- CONFIGURACIÓ DE LA XARXA (vis.network) ---
    const options = {
        layout: { 
            hierarchical: { 
                direction: 'UD', 
                sortMethod: 'directed', 
                levelSeparation: 150, 
                nodeSpacing: 400 
            } 
        },
        physics: false,
        interaction: { hover: true, dragNodes: false }
    };

    if (network) network.destroy();
    network = new vis.Network(document.getElementById('mynetwork'), { nodes, edges }, options);

    // En fer clic a un node, redibuixem l'arbre amb ell com a centre
    network.on("click", (params) => {
        if (params.nodes.length > 0) {
            const clickedId = params.nodes[0];
            // Actualitzem el cercador i redibuixem
            document.getElementById('search').value = clickedId;
            drawTree(clickedId);
        }
    });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Musical Lineage Tree</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f7f6; }
        header { background: #2c3e50; color: white; padding: 10px; text-align: center; }
        #controls { padding: 10px; text-align: center; background: white; border-bottom: 1px solid #ccc; }
        select { padding: 8px; width: 300px; font-size: 16px; }
        #mynetwork { width: 100%; height: calc(100vh - 120px); background: white; }
    </style>
</head>
<body>

<header><h1>Musical Lineage Tree</h1></header>
<div id="controls">
    <select id="search"><option>Carregant dades...</option></select>
</div>
<div id="mynetwork"></div>

<script>
let network = null;
let fullData = {};

// Converteix "ES" a emoji 🇪🇸
function codeToEmoji(code) {
    if (!code || code.length !== 2) return code || "";
    if (code.toLowerCase() === 'ca' || code.toLowerCase() === 'ct') return "🚩";
    return code.toUpperCase().replace(/./g, char => String.fromCodePoint(char.charCodeAt(0) + 127397));
}

// Carrega el CSV
Papa.parse("dades.csv", {
    download: true, header: true, skipEmptyLines: true,
    complete: function(results) {
        results.data.forEach(row => {
            fullData[row.ID_CODE] = {
                ...row,
                teachers: row.STUDENT_OF ? row.STUDENT_OF.split(',').map(s => s.trim()).filter(s => s) : []
            };
        });
        
        const select = document.getElementById('search');
        select.innerHTML = '<option value="">-- Tria un compositor --</option>';
        
        // Ordenació alfabètica per SORT_NAME
        results.data.sort((a,b) => {
            const nameA = (a.SORT_NAME || a.SURNAME || "").toLowerCase().replace(/^(de |von |van |d')/, "");
            const nameB = (b.SORT_NAME || b.SURNAME || "").toLowerCase().replace(/^(de |von |van |d')/, "");
            return nameA.localeCompare(nameB);
        }).forEach(r => {
            const opt = document.createElement('option');
            opt.value = r.ID_CODE;
            opt.textContent = r.SORT_NAME || `${r.SURNAME}, ${r.NAME}`;
            select.appendChild(opt);
        });

        select.onchange = function() { draw(this.value); };
        if (fullData['f_pedrell']) draw('f_pedrell');
    }
});

function draw(rootId) {
    if (!fullData[rootId]) return;

    const nodes = [];
    const edges = [];

    // Funció simple per crear nodes REALS
    function crearNode(id, level) {
        const c = fullData[id];
        if (!c) return; // Seguretat: si no existeix, no facis res

        const bgColor = level === 0 ? '#e6f7ff' : (level < 0 ? '#fff7e6' : '#f6ffed');
        const borderColor = level === 0 ? '#1890ff' : (level < 0 ? '#fa8c16' : '#52c41a');
        
        const title = c.DISPLAY_NAME || (c.NAME + " " + c.SURNAME);
        const sub = (c.DISPLAY_NAME && c.SURNAME && c.DISPLAY_NAME !== (c.NAME + " " + c.SURNAME)) ? `\n(${c.NAME} ${c.SURNAME})` : "";

        nodes.push({
            id: id,
            label: `<b>${title}</b>${sub}\n` +
                   `${codeToEmoji(c.BIRTH_FLAG)} ${c.BIRTH_PLACE || ''} (${c.BIRTH_YEAR || '?'})\n` +
                   `${codeToEmoji(c.DEATH_FLAG)} ${c.DEATH_PLACE || ''} (${c.DEATH_YEAR || '?'})`,
            shape: 'box',
            level: level,
            font: { multi: 'html', size: 14 },
            color: { background: bgColor, border: borderColor },
            margin: 10
        });
    }

    // 1. Dibuixem el centre
    crearNode(rootId, 0);

    // 2. Dibuixem els mestres (Dalt)
    fullData[rootId].teachers.forEach(tId => {
        if (fullData[tId]) {
            crearNode(tId, -1);
            edges.push({ from: tId, to: rootId, arrows: 'to', color: '#fa8c16' });
        }
    });

    // 3. Dibuixem els alumnes (Baix)
    Object.keys(fullData).forEach(sId => {
        if (fullData[sId].teachers.includes(rootId)) {
            crearNode(sId, 1);
            edges.push({ from: rootId, to: sId, arrows: 'to', color: '#52c41a' });
        }
    });

    // Renderitzar la xarxa
    const container = document.getElementById('mynetwork');
    if (network) network.destroy();

    network = new vis.Network(container, { nodes, edges }, {
        layout: { hierarchical: { direction: 'UD', sortMethod: 'directed', levelSeparation: 150, nodeSpacing: 300 } },
        physics: false,
        interaction: { dragNodes: false, selectable: true }
    });

    // CLIC DIRECTE: Torna a la vida
    network.on("click", function(params) {
        if (params.nodes.length > 0) {
            const selectedId = params.nodes[0];
            document.getElementById('search').value = selectedId;
            draw(selectedId);
        }
    });
}
</script>
</body>
</html>

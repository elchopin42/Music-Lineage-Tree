<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Musical Lineage Tree</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: #f4f7f6; }
        header { background: #2c3e50; color: white; padding: 15px; text-align: center; }
        #controls { padding: 15px; display: flex; justify-content: center; background: white; border-bottom: 1px solid #ddd; }
        select { padding: 10px; font-size: 16px; width: 400px; border-radius: 4px; }
        #mynetwork { width: 100%; height: calc(100vh - 160px); background: white; }
    </style>
</head>
<body>
<header><h1>Musical Lineage Tree</h1></header>
<div id="controls">
    <select id="search"><option>Carregant dades...</option></select>
</div>
<div id="mynetwork"></div>

<script>
let network = null;
let fullData = {};

Papa.parse("dades.csv", {
    download: true, header: true, skipEmptyLines: true,
    complete: function(results) {
        results.data.forEach(row => {
            fullData[row.ID_CODE] = {
                ...row,
                teachers: row.STUDENT_OF ? row.STUDENT_OF.split(',').map(s => s.trim()).filter(s => s) : []
            };
        });
        fillSelect(results.data);
    }
});

function fillSelect(data) {
    const select = document.getElementById('search');
    select.innerHTML = '<option value="">-- Tria un compositor --</option>';
    data.sort((a,b) => (a.SURNAME||"").localeCompare(b.SURNAME||"")).forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.ID_CODE;
        opt.textContent = `${r.SURNAME}, ${r.NAME}`;
        select.appendChild(opt);
    });
    select.onchange = (e) => draw(e.target.value);
    if(fullData['f_pedrell']) draw('f_pedrell');
}

function draw(rootId) {
    if (!fullData[rootId]) return;
    const nodes = [];
    const edges = [];
    const processedNodes = new Set();

    // Funció per crear l'etiqueta visual (sense emojis, compatible 100% amb Windows)
    function formatLabel(c) {
        const bFlag = c.BIRTH_FLAG ? c.BIRTH_FLAG.toUpperCase() : "??";
        const dFlag = c.DEATH_FLAG ? c.DEATH_FLAG.toUpperCase() : "??";
        return `<b>${c.NAME} ${c.SURNAME}</b>\n` +
               `Birth: [${bFlag}] ${c.BIRTH_PLACE || ''} (${c.BIRTH_YEAR || '?'})\n` +
               `Death: [${dFlag}] ${c.DEATH_PLACE || ''} (${c.DEATH_YEAR || '?'})`;
    }

    function addNode(id, level) {
        if (processedNodes.has(id)) return;
        const c = fullData[id];
        if (!c) return;
        
        let color = level === 0 ? '#e6f7ff' : (level < 0 ? '#fff7e6' : '#f6ffed');
        let border = level === 0 ? '#1890ff' : (level < 0 ? '#fa8c16' : '#52c41a');

        nodes.push({
            id: id,
            label: formatLabel(c),
            shape: 'box',
            level: level,
            color: { background: color, border: border },
            font: { multi: 'html', size: 14, face: 'Tahoma' },
            margin: 10
        });
        processedNodes.add(id);
    }

    // 1. EL CENTRE
    addNode(rootId, 0);

    // 2. MESTRES (Amunt)
    fullData[rootId].teachers.forEach(tId => {
        if (fullData[tId]) {
            addNode(tId, -1);
            edges.push({ from: tId, to: rootId, arrows: 'to', color: '#fa8c16', width: 2 });

            // Avis (Mestres dels mestres)
            fullData[tId].teachers.forEach(ttId => {
                if (fullData[ttId]) {
                    addNode(ttId, -2);
                    edges.push({ from: ttId, to: tId, arrows: 'to', color: '#fa8c16', dashes: true });
                }
            });
        }
    });

    // 3. ALUMNES (Avall)
    Object.keys(fullData).forEach(sId => {
        if (fullData[sId].teachers.includes(rootId)) {
            addNode(sId, 1);
            edges.push({ from: rootId, to: sId, arrows: 'to', color: '#52c41a', width: 2 });

            // Nets (Alumnes dels alumnes)
            Object.keys(fullData).forEach(ssId => {
                if (fullData[ssId].teachers.includes(sId)) {
                    addNode(ssId, 2);
                    edges.push({ from: sId, to: ssId, arrows: 'to', color: '#52c41a', dashes: true });
                }
            });
        }
    });

    const options = {
        layout: { 
            hierarchical: { 
                direction: 'UD', 
                sortMethod: 'directed', 
                levelSeparation: 150, 
                nodeSpacing: 400,
                blockShifting: true,
                edgeMinimization: true
            } 
        },
        physics: false
    };

    if (network) network.destroy();
    network = new vis.Network(document.getElementById('mynetwork'), { nodes, edges }, options);
    network.on("click", (p) => { if(p.nodes[0]) { document.getElementById('search').value = p.nodes[0]; draw(p.nodes[0]); } });
}
</script>
</body>
</html>

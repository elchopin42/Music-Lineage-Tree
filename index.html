<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Musical Lineage Tree</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f0f2f5; }
        header { background: #2c3e50; color: white; padding: 15px; text-align: center; }
        #controls { padding: 15px; display: flex; justify-content: center; background: white; border-bottom: 1px solid #ccc; }
        select { padding: 8px; font-size: 16px; width: 350px; }
        #mynetwork { width: 100%; height: calc(100vh - 150px); }
    </style>
</head>
<body>
<header><h1>Musical Lineage Tree</h1></header>
<div id="controls">
    <select id="search"><option>Carregant dades...</option></select>
</div>
<div id="mynetwork"></div>

<script>
let network = null;
let fullData = {};

function getFlag(code) {
    if (!code) return "";
    const c = code.toLowerCase().trim();
    if (c === 'cat') return "https://flagcdn.com/w80/es-ct.png";
    if (c === 'mar' || c === 'sea') return "https://cdn-icons-png.flaticon.com/128/411/411712.png";
    // Casos especials de codis de 3 lletres que potser tens a l'Excel
    const mapping = { 'ita': 'it', 'fra': 'fr', 'aus': 'at', 'spa': 'es' };
    const finalCode = mapping[c] || c;
    return `https://flagcdn.com/w80/${finalCode}.png`;
}

Papa.parse("dades.csv", {
    download: true, header: true, skipEmptyLines: true,
    complete: function(results) {
        results.data.forEach(row => {
            fullData[row.ID_CODE] = {
                ...row,
                teachers: row.STUDENT_OF ? row.STUDENT_OF.split(',').map(s => s.trim()).filter(s => s) : []
            };
        });
        fillSelect(results.data);
    }
});

function fillSelect(data) {
    const select = document.getElementById('search');
    select.innerHTML = '<option value="">-- Tria un compositor --</option>';
    data.sort((a,b) => (a.SURNAME||"").localeCompare(b.SURNAME||"")).forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.ID_CODE;
        opt.textContent = `${r.SURNAME}, ${r.NAME}`;
        select.appendChild(opt);
    });
    select.onchange = (e) => draw(e.target.value);
    if(fullData['f_pedrell']) draw('f_pedrell');
}

function draw(rootId) {
    if (!fullData[rootId]) return;
    const nodes = [];
    const edges = [];
    const center = fullData[rootId];

    // 1. NODE CENTRAL
    nodes.push(createNode(rootId, 0));

    // 2. MESTRES DIRECTES (Nivell -1)
    center.teachers.forEach(tId => {
        if (fullData[tId]) {
            nodes.push(createNode(tId, -1));
            edges.push({ from: tId, to: rootId, arrows: 'to', color: '#fa8c16', width: 2 });
            
            // MESTRES DELS MESTRES (Nivell -2)
            fullData[tId].teachers.forEach(ttId => {
                if (fullData[ttId]) {
                    if (!nodes.find(n => n.id === ttId)) nodes.push(createNode(ttId, -2));
                    edges.push({ from: ttId, to: tId, arrows: 'to', color: '#fa8c16', dashes: true });
                }
            });
        }
    });

    // 3. ALUMNES DIRECTES (Nivell 1)
    Object.keys(fullData).forEach(sId => {
        if (fullData[sId].teachers.includes(rootId)) {
            nodes.push(createNode(sId, 1));
            edges.push({ from: rootId, to: sId, arrows: 'to', color: '#52c41a', width: 2 });

            // ALUMNES DELS ALUMNES (Nivell 2)
            Object.keys(fullData).forEach(ssId => {
                if (fullData[ssId].teachers.includes(sId)) {
                    if (!nodes.find(n => n.id === ssId)) nodes.push(createNode(ssId, 2));
                    edges.push({ from: sId, to: ssId, arrows: 'to', color: '#52c41a', dashes: true });
                }
            });
        }
    });

    function createNode(id, level) {
        const c = fullData[id];
        let color = level === 0 ? '#e6f7ff' : (level < 0 ? '#fff7e6' : '#f6ffed');
        let border = level === 0 ? '#1890ff' : (level < 0 ? '#fa8c16' : '#52c41a');
        
        return {
            id: id,
            label: `<b>${c.NAME} ${c.SURNAME}</b>\n${c.BIRTH_PLACE} (${c.BIRTH_YEAR})\n${c.DEATH_PLACE} (${c.DEATH_YEAR})`,
            shape: 'box',
            level: level,
            color: { background: color, border: border, highlight: { background: '#d9d9d9', border: '#333' } },
            font: { multi: 'html', size: 14 },
            margin: 10
        };
    }

    const options = {
        layout: { hierarchical: { direction: 'UD', sortMethod: 'directed', levelSeparation: 150, nodeSpacing: 350 } },
        physics: false,
        interaction: { hover: true }
    };

    if (network) network.destroy();
    network = new vis.Network(document.getElementById('mynetwork'), { nodes, edges }, options);
    network.on("click", (p) => { if(p.nodes[0]) { document.getElementById('search').value = p.nodes[0]; draw(p.nodes[0]); } });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Musical Lineage Tree</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: #f4f7f6; }
        header { background: #2c3e50; color: white; padding: 15px; text-align: center; }
        #controls { padding: 10px; display: flex; justify-content: center; background: white; border-bottom: 1px solid #ddd; }
        select { padding: 8px; font-size: 16px; width: 350px; }
        #mynetwork { width: 100%; height: calc(100vh - 150px); background: white; }
    </style>
</head>
<body>
<header><h1>Musical Lineage Tree</h1></header>
<div id="controls">
    <select id="search"><option>Carregant dades...</option></select>
</div>
<div id="mynetwork"></div>

<script>
let network = null;
let fullData = {};

// Funció màgica per convertir "ES" en emoji 🇪🇸
function codeToEmoji(code) {
    if (!code || code.length !== 2) return code || "";
    if (code.toLowerCase() === 'ca' || code.toLowerCase() === 'ct') return "🚩"; // Senyera
    return code.toUpperCase().replace(/./g, char => String.fromCodePoint(char.charCodeAt(0) + 127397));
}

Papa.parse("dades.csv", {
    download: true, header: true, skipEmptyLines: true,
    complete: function(results) {
        results.data.forEach(row => {
            fullData[row.ID_CODE] = {
                ...row,
                teachers: row.STUDENT_OF ? row.STUDENT_OF.split(',').map(s => s.trim()).filter(s => s) : []
            };
        });
        fillSelect(results.data);
    }
});

function fillSelect(data) {
    const select = document.getElementById('search');
    select.innerHTML = '<option value="">-- Tria un compositor --</option>';
    data.sort((a,b) => {
        const nameA = (a.SORT_NAME || a.SURNAME || "").toLowerCase().replace(/^(de |von |van |d')/, "");
        const nameB = (b.SORT_NAME || b.SURNAME || "").toLowerCase().replace(/^(de |von |van |d')/, "");
        return nameA.localeCompare(nameB);
    }).forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.ID_CODE;
        opt.textContent = r.SORT_NAME || `${r.SURNAME}, ${r.NAME}`;
        select.appendChild(opt);
    });
    select.onchange = (e) => draw(e.target.value);
    if(fullData['f_pedrell']) draw('f_pedrell');
}

function draw(rootId) {
    if (!fullData[rootId]) return;
    const nodes = [];
    const edges = [];

    function addNode(id, level) {
        const c = fullData[id];
        const bgColor = level === 0 ? '#e6f7ff' : (level < 0 ? '#fff7e6' : '#f6ffed');
        const borderColor = level === 0 ? '#1890ff' : (level < 0 ? '#fa8c16' : '#52c41a');
        
        const title = c.DISPLAY_NAME || `${c.NAME} ${c.SURNAME}`;
        const sub = (c.DISPLAY_NAME && c.SURNAME && c.DISPLAY_NAME !== (c.NAME + " " + c.SURNAME)) ? `\n(${c.NAME} ${c.SURNAME})` : "";

        nodes.push({
            id: id,
            label: `<b>${title}</b>${sub}\n` +
                   `${codeToEmoji(c.BIRTH_FLAG)} ${c.BIRTH_PLACE || ''} (${c.BIRTH_YEAR || '?'})\n` +
                   `${codeToEmoji(c.DEATH_FLAG)} ${c.DEATH_PLACE || ''} (${c.DEATH_YEAR || '?'})`,
            shape: 'box',
            level: level,
            font: { multi: 'html', size: 14 },
            color: { background: bgColor, border: borderColor },
            margin: 10
        });
    }

    // 1. Centre
    addNode(rootId, 0);

    // 2. Mestres (Dalt)
    fullData[rootId].teachers.forEach(tId => {
        if (fullData[tId]) {
            addNode(tId, -1);
            edges.push({ from: tId, to: rootId, arrows: 'to', color: '#fa8c16' });
            // Fletxa de "hi ha més"
            if (fullData[tId].teachers.length > 0) {
                const upId = "up_" + tId;
                nodes.push({ id: upId, label: '', shape: 'text', level: -2 });
                edges.push({ from: upId, to: tId, arrows: 'to', color: '#fa8c16', dashes: true });
            }
        }
    });

    // 3. Alumnes (Baix)
    Object.keys(fullData).forEach(sId => {
        if (fullData[sId].teachers.includes(rootId)) {
            addNode(sId, 1);
            edges.push({ from: rootId, to: sId, arrows: 'to', color: '#52c41a' });
            // Fletxa de "hi ha més"
            const hasMore = Object.values(fullData).some(anyS => anyS.teachers.includes(sId));
            if (hasMore) {
                const downId = "down_" + sId;
                nodes.push({ id: downId, label: '', shape: 'text', level: 2 });
                edges.push({ from: sId, to: downId, arrows: 'to', color: '#52c41a', dashes: true });
            }
        }
    });

    if (network) network.destroy();
    network = new vis.Network(document.getElementById('mynetwork'), { nodes, edges }, {
        layout: { hierarchical: { direction: 'UD', sortMethod: 'directed', levelSeparation: 150, nodeSpacing: 300 } },
        physics: false,
        interaction: { dragNodes: false }
    });

    // CLIC FINAL: Sense errors
    network.on("click", function(p) {
        if (p.nodes[0] && !p.nodes[0].toString().includes('_')) {
            const newId = p.nodes[0];
            document.getElementById('search').value = newId;
            draw(newId);
        }
    });
}
</script>
</body>
</html>

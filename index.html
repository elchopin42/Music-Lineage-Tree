<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Musical Lineage Tree</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f7f6; }
        header { background: #2c3e50; color: white; padding: 10px; text-align: center; }
        #controls { padding: 15px; text-align: center; background: white; border-bottom: 1px solid #ccc; display: flex; justify-content: center; align-items: center; gap: 10px; }
        select { padding: 8px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; }
        #search { width: 300px; }
        #mynetwork { width: 100%; height: calc(100vh - 130px); background: white; }
        label { font-weight: bold; }
    </style>
</head>
<body>

<header><h1>Musical Lineage Tree</h1></header>

<div id="controls">
    <label id="label-search" for="search">Cerca:</label>
    <select id="search"><option>Carregant dades...</option></select>
    
    <select id="lang-selector" onchange="changeLanguage(this.value)">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="nl">Nederlands</option>
        <option value="de">Deutsch</option>
        <option value="pt">Português</option>
        <option value="es">Castellano</option>
        <option value="ca">Català</option>
        <option value="it">Italiano</option>        
    </select>
</div>

<div id="mynetwork"></div>

<script>
// 1. DICCIONARI DE TRADUCCIONS
const i18n = {
    en: { select: "-- Choose a composer --", pending: "Pending entry", search: "Search:" },
    fr: { select: "-- Choisir un compositeur --", pending: "Entrée en attente", search: "Chercher:" },
    nl: { select: "-- Kies een componist --", pending: "In afwachting", search: "Zoeken:" }
    de: { select: "-- Komponisten wählen --", pending: "Eintrag ausstehend", search: "Suche:" },
    pt: { select: "-- Escolha um compositor --", pending: "Entrada pendente", search: "Procurar:" },
    es: { select: "-- Elige un compositor --", pending: "Entrada pendiente", search: "Buscar:" },
    ca: { select: "-- Tria un compositor --", pending: "Entrada pendent", search: "Cerca:" },
    it: { select: "-- Scegli un compositore --", pending: "Voce in attesa", search: "Cerca:" },
};

let currentLang = 'en'; 
let network = null;
let fullData = {};

// Converteix codis ISO a emoji
function codeToEmoji(code) {
    if (!code || code.length !== 2) return code || "";
    return code.toUpperCase().replace(/./g, char => String.fromCodePoint(char.charCodeAt(0) + 127397));
}

// Funció per canviar l'idioma
function changeLanguage(lang) {
    currentLang = lang;
    const select = document.getElementById('search');
    
    // Actualitzem textos de la interfície
    select.options[0].textContent = i18n[currentLang].select;
    document.getElementById('label-search').textContent = i18n[currentLang].search;
    
    // Si hi ha algú seleccionat, redibuixem per actualitzar "Pending entry" i fletxes
    if (select.value) draw(select.value);
}

// Carrega el CSV
Papa.parse("dades.csv", {
    download: true, header: true, skipEmptyLines: true,
    complete: function(results) {
        results.data.forEach(row => {
            fullData[row.ID_CODE] = {
                ...row,
                teachers: row.STUDENT_OF ? row.STUDENT_OF.split(',').map(s => s.trim()).filter(s => s) : []
            };
        });
        
        const select = document.getElementById('search');
        select.innerHTML = `<option value="">${i18n[currentLang].select}</option>`;
        
        results.data.sort((a,b) => {
            const nameA = (a.SORT_NAME || a.SURNAME || "").toLowerCase().replace(/^(de |von |van |d')/, "");
            const nameB = (b.SORT_NAME || b.SURNAME || "").toLowerCase().replace(/^(de |von |van |d')/, "");
            return nameA.localeCompare(nameB);
        }).forEach(r => {
            const opt = document.createElement('option');
            opt.value = r.ID_CODE;
            opt.textContent = r.SORT_NAME || `${r.SURNAME}, ${r.NAME}`;
            select.appendChild(opt);
        });

        select.onchange = function() { draw(this.value); };
        if (fullData['f_pedrell']) draw('f_pedrell');
    }
});

function crearNode(id, level, nodesArray) {
    const c = fullData[id];
    if (!c) return;

    const bgColor = level === 0 ? '#e6f7ff' : (level < 0 ? '#fff7e6' : '#f6ffed');
    const borderColor = level === 0 ? '#1890ff' : (level < 0 ? '#fa8c16' : '#52c41a');
    
    // Continuïtat
    const teMestres = c.teachers && c.teachers.length > 0;
    const teAlumnes = Object.keys(fullData).some(sId => fullData[sId].teachers.includes(id));
    
    const title = c.DISPLAY_NAME || (c.NAME + " " + c.SURNAME);
    const sub = (c.DISPLAY_NAME && c.SURNAME && c.DISPLAY_NAME !== (c.NAME + " " + c.SURNAME)) ? `\n(${c.NAME} ${c.SURNAME})` : "";

    let indicadorDalt = (level < 0 && teMestres) ? "▲\n" : "";
    let indicadorBaix = (level > 0 && teAlumnes) ? "\n▼" : "";
    const fontSize = level === 0 ? 18 : 14;

    nodesArray.push({
        id: id,
        label: `${indicadorDalt}<b>${title}</b>${sub}\n` +
               `${codeToEmoji(c.BIRTH_FLAG)} ${c.BIRTH_PLACE || ''} (${c.BIRTH_YEAR || '?'})\n` +
               `${codeToEmoji(c.DEATH_FLAG)} ${c.DEATH_PLACE || ''} (${c.DEATH_YEAR || '?'})${indicadorBaix}`,
        shape: 'box',
        level: level,
        font: { multi: 'html', size: fontSize, align: 'center' },
        color: { background: bgColor, border: borderColor },
        borderWidth: level === 0 ? 2 : (((level < 0 && teMestres) || (level > 0 && teAlumnes)) ? 3 : 1),
        margin: 10
    });
}

function draw(rootId) {
    if (!fullData[rootId]) return;
    const nodes = [];
    const edges = [];

    // 1. Centre
    crearNode(rootId, 0, nodes);

    // 2. Mestres (Dalt)
    fullData[rootId].teachers.forEach(tId => {
        if (fullData[tId]) {
            crearNode(tId, -1, nodes);
            edges.push({ from: tId, to: rootId, arrows: 'to', color: '#fa8c16' });
        } else {
            // Node Pendent (traduït)
            nodes.push({
                id: tId,
                label: `<b>${tId}</b>\n<i>(${i18n[currentLang].pending})</i>`,
                shape: 'box',
                level: -1,
                font: { multi: 'html', size: 12, color: '#666666' },
                color: { background: '#eeeeee', border: '#cccccc' },
                borderDash: [5, 5],
                margin: 10
            });
            edges.push({ from: tId, to: rootId, arrows: 'to', color: '#cccccc' });
        }
    });

    // 3. Alumnes (Baix)
    Object.keys(fullData)
        .filter(sId => fullData[sId].teachers.includes(rootId))
        .sort((a, b) => {
            const parseYear = (id) => {
                const yearStr = fullData[id].BIRTH_YEAR;
                if (!yearStr) return 9999;
                const match = yearStr.match(/\d+/);
                return match ? parseInt(match[0]) : 9999;
            };
            const yearA = parseYear(a), yearB = parseYear(b);
            return yearA === yearB ? (fullData[a].SURNAME || "").localeCompare(fullData[b].SURNAME || "") : yearA - yearB;
        })
        .forEach(sId => {
            crearNode(sId, 1, nodes);
            edges.push({ from: rootId, to: sId, arrows: 'to', color: '#52c41a' });
        });

    const container = document.getElementById('mynetwork');
    if (network) network.destroy();
    network = new vis.Network(container, { nodes, edges }, {
        layout: { hierarchical: { direction: 'UD', sortMethod: 'directed', levelSeparation: 150, nodeSpacing: 300 } },
        physics: false,
        interaction: { dragNodes: false, selectable: true }
    });

    network.on("click", function(params) {
        if (params.nodes.length > 0) {
            const selectedId = params.nodes[0];
            if (fullData[selectedId]) {
                document.getElementById('search').value = selectedId;
                draw(selectedId);
            }
        }
    });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Musical Lineage Tree</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<style>
    body { font-family: sans-serif; margin: 0; background: #f4f7f6; overflow: hidden; }
    header { background: #2c3e50; color: white; padding: 10px; text-align: center; position: relative; }
    header h1 { font-size: 1.2rem; margin: 0; display: flex; justify-content: center; align-items: center; }

    #controls { 
        padding: 10px; 
        background: white; 
        border-bottom: 1px solid #ccc; 
        display: flex; 
        flex-wrap: wrap; 
        justify-content: center; 
        align-items: center; 
        gap: 10px; 
    }

    /* El cercador ara s'adapta a l'ample disponible */
    #search { width: 100%; max-width: 300px; padding: 8px; font-size: 16px; }
    #lang-selector { padding: 8px; font-size: 16px; }
    
    #mynetwork { width: 100%; height: calc(100vh - 140px); background: white; }
    
    /* MODAL RESPONSIVE */
    .modal-content { 
        background: white; 
        margin: 5% auto; 
        padding: 20px; 
        width: 85%; /* Més ample en mòbil */
        max-height: 80vh;
        overflow-y: auto;
        border-radius: 12px; 
    }

    /* AJUSTS PER A MÒBIL */
    @media (max-width: 600px) {
        #controls { flex-direction: column; padding: 5px; }
        #search { width: 90%; }
        header h1 { font-size: 1rem; }
        .modal-content { width: 90%; padding: 15px; margin: 2% auto; }
    }
</style>
</head>
<body>

<header>
    <h1>Musical Lineage Tree 
        <button class="info-icon" onclick="toggleModal()">i</button>
    </h1>
</header>

<div id="controls">
    <label id="label-search" for="search">Search:</label>
    <select id="search"><option>Loading data...</option></select>
    
    <select id="lang-selector" onchange="changeLanguage(this.value)">
        <option value="en" selected>English</option>
        <option value="fr">Français</option>
        <option value="nl">Nederlands</option>
        <option value="de">Deutsch</option>
        <option value="pt">Português</option>
        <option value="es">Castellano</option>
        <option value="ca">Català</option>
        <option value="it">Italiano</option>
    </select>
</div>

<div id="modal">
    <div class="modal-content">
        <h2 id="modal-title"></h2>
        <p id="modal-intro" style="font-weight: bold;"></p>
        <ul id="modal-body"></ul>
        <button onclick="toggleModal()" id="modal-close" class="close-btn"></button>
        <div style="clear:both;"></div>
    </div>
</div>

<div id="mynetwork"></div>

<script>

            "Dans le cas de territoires contestés, le drapeau du pays exerçant actuellement un contrôle de facto sur la zone a été utilisé.",

            "Ce projet inclut uniquement les compositeurs décédés avant l'année 2026. Par conséquent, tout décès survenant après cette date peut ne pas être reflété."
        ]
    },
    nl: {
        select: "-- Kies een componist --", pending: "In afwachting", search: "Zoeken:", loading: "Laden...",
        about_title: "Over het project",
        intro: "Interactieve database die de pedagogische verbindingen en afstamming tussen componisten en muzikanten door de geschiedenis heen verkent.",
        close: "Sluiten",
        rules: [
            "Alle namen van componisten en steden zijn in hun oorspronkelijke taal.",
            "Voor namen en plaatsen die oorspronkelijk in het Cyrillisch, Arabisch of andere niet-Latijnse alfabetten waren, is de Engelse transliteratie gebruikt.",
            "Vlaggen verwijzen naar het huidige land van elke stad, in plaats van de historische staat of het rijk waartoe het destijds behoorde.",

        rules: [

            "Für Namen und Orte, die ursprünglich in kyrillischen, arabischen oder anderen nicht-lateinischen Alphabeten verfasst waren, wurde die englische Transliteration verwendet.",
            "Flaggen beziehen sich auf das heutige Land jeder Stadt und nicht auf den historischen Staat oder das Reich, dem sie damals angehörte.",
            "Im Falle umstrittener Gebiete wurde die Flagge des Landes verwendet, das derzeit die faktische Kontrolle über das Gebiet ausübt.",

        ]
    },
    pt: {
        select: "-- Escolha um compositor --", pending: "Entrada pendente", search: "Procurar:", loading: "Carregando...",
        about_title: "Sobre o Projeto",

            "As bandeiras referem-se ao país atual de cada cidade, e não ao estado ou império histórico a que pertencia na época.",

    },
    es: {

        intro: "Base de datos interactiva que explora las conexiones pedagógicas y el linaje entre compositores y músicos a lo largo de la historia.",

        rules: [
            "Todos los nombres de compositores y ciudades están en su idioma original.",
            "Para nombres y lugares originalmente en alfabetos cirílico, árabe u otros no latinos, se ha utilizado la transliteración al inglés.",
            "Las banderas se refieren al país actual de cada ciudad, en lugar del estado o imperio histórico al que pertenecía en su momento.",
            "En caso de territorios en disputa, se ha utilizado la bandera del país que actualmente tiene el control de facto del área.",

    },
    ca: {

        about_title: "Sobre el Projecte",
        intro: "Base de dades interactiva que explora les connexions pedagògiques i el llinatge entre compositors i músics al llarg de la història.",
        close: "Tancar",
        rules: [
            "Tots els noms de compositors i ciutats estan en el seu idioma original.",
            "Per a noms i llocs originalment en alfabets ciríl·lic, àrab o altres no llatins, s'ha utilitzat la transliteració a l'anglès.",
            "Les banderes es refereixen al país actual de cada ciutat, en lloc de l'estat o imperi històric al qual pertanyia en el seu moment.",
            "En cas de territoris en disputa, s'ha utilitzat la bandera del país que actualment té el control de facto de l'àrea.",
            "Les dates de naixement i mort dels compositors russos poden no ser exactes a causa de l'ús històric del calendari julià.",

    },
    it: {
        select: "-- Scegli un compositore --", pending: "Voce in attesa", search: "Cerca:", loading: "Caricamento...",
        about_title: "Informazioni sul progetto",
        intro: "Database interattivo che esplora le connessioni pedagogiche e la stirpe tra compositori e musicisti attraverso la storia.",
        close: "Chiudi",
        rules: [
            "Tutti i nomi di compositori e città sono nella loro lingua originale.",
            "Per i nomi e i luoghi originariamente in alfabeti cirillico, arabo o altri non latini, è stata utilizzata la traslitterazione inglese.",
            "Le bandiere si riferiscono allo stato attuale di ogni città, piuttosto che allo stato storico o all'impero a cui apparteneva all'epoca.",
            "Nel caso di territoris contesi, è stata utilizzata la bandiera del paese che attualmente detiene il controllo de facto dell'area.",

let currentLang = 'en'; 
let network = null;
let fullData = {};

function toggleModal() {
    const modal = document.getElementById('modal');
    if (modal.style.display === 'block') {
        modal.style.display = 'none';
    } else {
        document.getElementById('modal-title').textContent = i18n[currentLang].about_title;
        document.getElementById('modal-intro').textContent = i18n[currentLang].intro;
        document.getElementById('modal-close').textContent = i18n[currentLang].close;
        const list = document.getElementById('modal-body');
        list.innerHTML = "";
        i18n[currentLang].rules.forEach(rule => {
            const li = document.createElement('li');
            li.textContent = rule;
            list.appendChild(li);
        });
        modal.style.display = 'block';
    }
}

function codeToEmoji(code) {
    if (!code || code.length !== 2) return code || "";
    return code.toUpperCase().replace(/./g, char => String.fromCodePoint(char.charCodeAt(0) + 127397));
}

function changeLanguage(lang) {
    currentLang = lang;
    const select = document.getElementById('search');
    if (select.options.length <= 1) {
        select.options[0].textContent = i18n[currentLang].loading;
    } else {
        select.options[0].textContent = i18n[currentLang].select;
    }
    document.getElementById('label-search').textContent = i18n[currentLang].search;
    if (select.value && select.value !== "") draw(select.value);
}

Papa.parse("dades.csv", {
    download: true, header: true, skipEmptyLines: true,
    complete: function(results) {
        results.data.forEach(row => {
            fullData[row.ID_CODE] = {
                ...row,
                teachers: row.STUDENT_OF ? row.STUDENT_OF.split(',').map(s => s.trim()).filter(s => s) : []
            };
        });
        const select = document.getElementById('search');
        select.innerHTML = `<option value="">${i18n[currentLang].select}</option>`;
        results.data.sort((a,b) => {
            const nameA = (a.SORT_NAME || a.SURNAME || "").toLowerCase().replace(/^(de |von |van |d')/, "");
            const nameB = (b.SORT_NAME || b.SURNAME || "").toLowerCase().replace(/^(de |von |van |d')/, "");
            return nameA.localeCompare(nameB);
        }).forEach(r => {
            const opt = document.createElement('option');
            opt.value = r.ID_CODE;
            opt.textContent = r.SORT_NAME || `${r.SURNAME}, ${r.NAME}`;
            select.appendChild(opt);
        });
        select.onchange = function() { draw(this.value); };
        if (fullData['f_pedrell']) draw('f_pedrell');
    }
});

function crearNode(id, level, nodesArray) {
    const c = fullData[id];
    if (!c) return;
    const bgColor = level === 0 ? '#e6f7ff' : (level < 0 ? '#fff7e6' : '#f6ffed');
    const borderColor = level === 0 ? '#1890ff' : (level < 0 ? '#fa8c16' : '#52c41a');
    const teMestres = c.teachers && c.teachers.length > 0;
    const teAlumnes = Object.keys(fullData).some(sId => fullData[sId].teachers.includes(id));
    const title = c.DISPLAY_NAME || (c.NAME + " " + c.SURNAME);
    const sub = (c.DISPLAY_NAME && c.SURNAME && c.DISPLAY_NAME !== (c.NAME + " " + c.SURNAME)) ? `\n(${c.NAME} ${c.SURNAME})` : "";
    let indicadorDalt = (level < 0 && teMestres) ? "▲\n" : "";
    let indicadorBaix = (level > 0 && teAlumnes) ? "\n▼" : "";
    const fontSize = level === 0 ? 18 : 14;
    nodesArray.push({
        id: id,
        label: `${indicadorDalt}<b>${title}</b>${sub}\n` +
               `${codeToEmoji(c.BIRTH_FLAG)} ${c.BIRTH_PLACE || ''} (${c.BIRTH_YEAR || '?'})\n` +
               `${codeToEmoji(c.DEATH_FLAG)} ${c.DEATH_PLACE || ''} (${c.DEATH_YEAR || '?'})${indicadorBaix}`,
        shape: 'box', level: level, font: { multi: 'html', size: fontSize, align: 'center' },
        color: { background: bgColor, border: borderColor },
        borderWidth: level === 0 ? 2 : (((level < 0 && teMestres) || (level > 0 && teAlumnes)) ? 3 : 1),
        margin: 10
    });
}

function draw(rootId) {
    if (!fullData[rootId]) return;
    const nodes = [];
    const edges = [];
    crearNode(rootId, 0, nodes);
    
    // ... (aquí aniria tota la lògica de mestres i alumnes que ja tens) ...

    const container = document.getElementById('mynetwork');
    if (network) network.destroy();
    
    // Creem la xarxa
    network = new vis.Network(container, { nodes, edges }, {
        layout: { hierarchical: { direction: 'UD', sortMethod: 'directed', levelSeparation: 150, nodeSpacing: 300 } },
        physics: false, 
        interaction: { dragNodes: false, selectable: true }
    });

    // --- AQUÍ ESTÀ EL TRUC PER AL MÒBIL ---
    // Aquest codi s'executa UNA VEGADA quan la xarxa ha acabat de dibuixar-se
    network.once("afterDrawing", function() {
        network.fit({
            animation: { duration: 500, easingFunction: 'easeInOutQuad' }
        });
    });
    // --------------------------------------

    // Després ve el codi del clic que ja tenies
    network.on("click", function(params) {
        if (params.nodes.length > 0) {
            const selectedId = params.nodes[0];
            if (fullData[selectedId]) {
                document.getElementById('search').value = selectedId;
                draw(selectedId);
            }
        }
    });
}
</script>
</body>
</html>

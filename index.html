<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Musical Lineage Tree</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css"/>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; background-color: #f4f7f6; color: #333; }
        header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
        #controls { padding: 20px; display: flex; justify-content: center; background: #ecf0f1; border-bottom: 1px solid #ccc; }
        select { padding: 10px; font-size: 16px; width: 400px; }
        #mynetwork { width: 100%; height: calc(100vh - 180px); background: white; }
    </style>
</head>
<body>

<header>
    <h1>Musical Lineage Tree</h1>
</header>

<div id="controls">
    <select id="search"><option value="">Carregant compositors...</option></select>
</div>

<div id="mynetwork"></div>

<script>
let network = null;
let fullData = {};

// 1. Càrrega del fitxer CSV
Papa.parse("dades.csv", {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
        processData(results.data);
    }
});

function processData(data) {
    const select = document.getElementById('search');
    select.innerHTML = '<option value="">-- Selecciona un compositor --</option>';

    data.forEach(row => {
        fullData[row.ID_CODE] = {
            ...row,
            teachers: row.STUDENT_OF ? row.STUDENT_OF.split(',').map(s => s.trim()) : []
        };
    });

    data.sort((a, b) => (a.SURNAME || "").localeCompare(b.SURNAME || "")).forEach(row => {
        const opt = document.createElement('option');
        opt.value = row.ID_CODE;
        opt.textContent = `${row.SURNAME}, ${row.NAME}`;
        select.appendChild(opt);
    });

    select.addEventListener('change', (e) => drawTree(e.target.value));
    if (fullData['f_pedrell']) { select.value = 'f_pedrell'; drawTree('f_pedrell'); }
}

function drawTree(rootId) {
    if (!rootId || !fullData[rootId]) return;

    const nodes = new Map();
    const edges = [];
    const processedIds = new Set();

    function buildGraph(currentId, level, direction) {
        const key = currentId; // Clau única per compositor
        if (processedIds.has(key + direction)) return; 
        processedIds.add(key + direction);

        const comp = fullData[currentId];
        if (!comp) return;

        // Configuració visual segons nivell
        let color = '#f6ffed'; let border = '#52c41a'; // Alumnes (Verd)
        if (level === 0) { color = '#e6f7ff'; border = '#1890ff'; } // Focus (Blau)
        if (level < 0) { color = '#fff7e6'; border = '#fa8c16'; } // Mestres (Taronja)

        // Creem l'etiqueta amb Banderes, Anys i Ciutats
        const bFlag = comp.BIRTH_FLAG ? `[${comp.BIRTH_FLAG.toUpperCase()}] ` : "";
        const dFlag = comp.DEATH_FLAG ? `[${comp.DEATH_FLAG.toUpperCase()}] ` : "";
        
        const label = `<b>${comp.NAME} ${comp.SURNAME}</b>\n` +
                      `birth: ${bFlag}${comp.BIRTH_PLACE || '?'} (${comp.BIRTH_YEAR || '?'})\n` +
                      `death: ${dFlag}${comp.DEATH_PLACE || '?'} (${comp.DEATH_YEAR || '?'})`;

        if (!nodes.has(currentId)) {
            nodes.set(currentId, {
                id: currentId,
                label: label,
                level: level,
                shape: 'box',
                color: { background: color, border: border },
                font: { multi: 'html', size: 14 },
                margin: 10
            });
        }

        // MESTRES (Cap amunt) - Fins a 2 nivells
        if (direction <= 0 && level > -2) {
            comp.teachers.forEach(tId => {
                if (fullData[tId]) {
                    edges.push({ from: tId, to: currentId, arrows: 'to' });
                    buildGraph(tId, level - 1, -1);
                }
            });
        }

        // ALUMNES (Cap avall) - Fins a 2 nivells
        if (direction >= 0 && level < 2) {
            Object.keys(fullData).forEach(potStudentId => {
                const potStudent = fullData[potStudentId];
                if (potStudent.teachers.includes(currentId)) {
                    edges.push({ from: currentId, to: potStudentId, arrows: 'to' });
                    buildGraph(potStudentId, level + 1, 1);
                }
            });
        }
    }

    buildGraph(rootId, 0, 0);

    const container = document.getElementById('mynetwork');
    const graphData = { nodes: Array.from(nodes.values()), edges: edges };
    const options = {
        layout: { 
            hierarchical: { 
                direction: 'UD', 
                sortMethod: 'directed', 
                levelSeparation: 200, 
                nodeSpacing: 300,
                parentCentralization: true 
            } 
        },
        physics: false,
        interaction: { dragNodes: false }
    };

    if (network) network.destroy();
    network = new vis.Network(container, graphData, options);

    network.on("click", (params) => {
        if (params.nodes.length > 0) {
            document.getElementById('search').value = params.nodes[0];
            drawTree(params.nodes[0]);
        }
    });
}
</script>
</body>
</html>

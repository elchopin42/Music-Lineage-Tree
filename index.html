<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Musical Lineage Tree</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f4f7f6; }
        header { background: #2c3e50; color: white; padding: 15px; text-align: center; }
        #controls { padding: 15px; display: flex; justify-content: center; background: white; border-bottom: 1px solid #ddd; }
        select { padding: 10px; font-size: 16px; width: 400px; border-radius: 4px; }
        #mynetwork { width: 100%; height: calc(100vh - 150px); background: white; }
    </style>
</head>
<body>
<header><h1>Musical Lineage Tree</h1></header>
<div id="controls">
    <select id="search"><option>Carregant dades...</option></select>
</div>
<div id="mynetwork"></div>

<script>
let network = null;
let fullData = {};

// Funció per a les banderes (Emoji / Text)
function getFlagEmoji(code) {
    if (!code) return "";
    const c = code.toLowerCase().trim();
    if (c === 'cat') return "🚩 ";
    if (c === 'mar' || c === 'sea') return "🌊 ";
    // Converteix ISO a Emoji (es -> 🇪🇸). A Windows es veuran les lletres, que és correcte.
    return c.toUpperCase().replace(/./g, char => String.fromCodePoint(char.charCodeAt(0) + 127397)) + " ";
}

Papa.parse("dades.csv", {
    download: true, header: true, skipEmptyLines: true,
    complete: function(results) {
        results.data.forEach(row => {
            fullData[row.ID_CODE] = {
                ...row,
                teachers: row.STUDENT_OF ? row.STUDENT_OF.split(',').map(s => s.trim()).filter(s => s) : []
            };
        });
        fillSelect(results.data);
    }
});

function fillSelect(data) {
    const select = document.getElementById('search');
    select.innerHTML = '<option value="">-- Tria un compositor --</option>';
    data.sort((a,b) => (a.SURNAME||"").localeCompare(b.SURNAME||"")).forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.ID_CODE;
        opt.textContent = `${r.SURNAME}, ${r.NAME}`;
        select.appendChild(opt);
    });
    select.onchange = (e) => draw(e.target.value);
    if(fullData['f_pedrell']) draw('f_pedrell');
}

function draw(rootId) {
    if (!fullData[rootId]) return;
    const nodes = [];
    const edges = [];
    const processedNodes = new Set();

    function addNode(id, level) {
        if (processedNodes.has(id)) return;
        const c = fullData[id];
        if (!c) return;

        const color = level === 0 ? '#e6f7ff' : (level < 0 ? '#fff7e6' : '#f6ffed');
        const border = level === 0 ? '#1890ff' : (level < 0 ? '#fa8c16' : '#52c41a');

        nodes.push({
            id: id,
            label: `<b>${c.NAME} ${c.SURNAME}</b>\n` +
                   `${getFlagEmoji(c.BIRTH_FLAG)}${c.BIRTH_PLACE || ''} (${c.BIRTH_YEAR || '?'})\n` +
                   `${getFlagEmoji(c.DEATH_FLAG)}${c.DEATH_PLACE || ''} (${c.DEATH_YEAR || '?'})`,
            shape: 'box',
            level: level,
            color: { background: color, border: border },
            font: { multi: 'html', size: 14 },
            margin: 10
        });
        processedNodes.add(id);
    }

    addNode(rootId, 0);

    // Mestres
    fullData[rootId].teachers.forEach(tId => {
        if (fullData[tId]) {
            addNode(tId, -1);
            edges.push({ from: tId, to: rootId, arrows: 'to', color: '#fa8c16' });
            fullData[tId].teachers.forEach(ttId => {
                if (fullData[ttId]) {
                    addNode(ttId, -2);
                    edges.push({ from: ttId, to: tId, arrows: 'to', color: '#fa8c16', dashes: true });
                }
            });
        }
    });

    // Alumnes
    Object.keys(fullData).forEach(sId => {
        if (fullData[sId].teachers.includes(rootId)) {
            addNode(sId, 1);
            edges.push({ from: rootId, to: sId, arrows: 'to', color: '#52c41a' });
            Object.keys(fullData).forEach(ssId => {
                if (fullData[ssId].teachers.includes(sId)) {
                    addNode(ssId, 2);
                    edges.push({ from: sId, to: ssId, arrows: 'to', color: '#52c41a', dashes: true });
                }
            });
        }
    });

    if (network) network.destroy();
    network = new vis.Network(document.getElementById('mynetwork'), { nodes, edges }, {
        layout: { hierarchical: { direction: 'UD', sortMethod: 'directed', levelSeparation: 150, nodeSpacing: 350 } },
        physics: false
    });
    network.on("click", (p) => { if(p.nodes[0]) { document.getElementById('search').value = p.nodes[0]; draw(p.nodes[0]); } });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Musical Lineage Tree</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f7f6; }
        header { background: #2c3e50; color: white; padding: 10px; text-align: center; }
        #controls { padding: 10px; text-align: center; background: white; border-bottom: 1px solid #ccc; }
        select { padding: 8px; width: 300px; font-size: 16px; }
        #mynetwork { width: 100%; height: calc(100vh - 120px); background: white; }
    </style>
</head>
<body>

<header><h1>Musical Lineage Tree</h1></header>
<div id="controls">
    <select id="search"><option>Carregant dades...</option></select>
</div>
<div id="mynetwork"></div>

<script>
let network = null;
let fullData = {};

// Converteix codis ISO (com "ES", "CA", "FR") directament a l'emoji de la bandera oficial
function codeToEmoji(code) {
    if (!code || code.length !== 2) return code || "";
    // Simplement convertim el codi de 2 lletres a l'emoji regional estàndard
    return code.toUpperCase().replace(/./g, char => String.fromCodePoint(char.charCodeAt(0) + 127397));
}
    
// Carrega el CSV
Papa.parse("dades.csv", {
    download: true, header: true, skipEmptyLines: true,
    complete: function(results) {
        results.data.forEach(row => {
            fullData[row.ID_CODE] = {
                ...row,
                teachers: row.STUDENT_OF ? row.STUDENT_OF.split(',').map(s => s.trim()).filter(s => s) : []
            };
        });
        
        const select = document.getElementById('search');
        select.innerHTML = '<option value="">-- Tria un compositor --</option>';
        
        // Ordenació alfabètica per SORT_NAME
        results.data.sort((a,b) => {
            const nameA = (a.SORT_NAME || a.SURNAME || "").toLowerCase().replace(/^(de |von |van |d')/, "");
            const nameB = (b.SORT_NAME || b.SURNAME || "").toLowerCase().replace(/^(de |von |van |d')/, "");
            return nameA.localeCompare(nameB);
        }).forEach(r => {
            const opt = document.createElement('option');
            opt.value = r.ID_CODE;
            opt.textContent = r.SORT_NAME || `${r.SURNAME}, ${r.NAME}`;
            select.appendChild(opt);
        });

        select.onchange = function() { draw(this.value); };
        if (fullData['f_pedrell']) draw('f_pedrell');
    }
});

function draw(rootId) {
    if (!fullData[rootId]) return;

    const nodes = [];
    const edges = [];

    // Funció simple per crear nodes REALS
function crearNode(id, level) {
        const c = fullData[id];
        if (!c) return;

        const bgColor = level === 0 ? '#e6f7ff' : (level < 0 ? '#fff7e6' : '#f6ffed');
        const borderColor = level === 0 ? '#1890ff' : (level < 0 ? '#fa8c16' : '#52c41a');
        
        // Comprovar continuïtat
        const teMestres = c.teachers && c.teachers.length > 0;
        const teAlumnes = Object.keys(fullData).some(sId => fullData[sId].teachers.includes(id));
        
        const title = c.DISPLAY_NAME || (c.NAME + " " + c.SURNAME);
        const sub = (c.DISPLAY_NAME && c.SURNAME && c.DISPLAY_NAME !== (c.NAME + " " + c.SURNAME)) ? `\n(${c.NAME} ${c.SURNAME})` : "";

        // Indicadors de fletxa (fora del flux de text principal)
        let arrowUp = (level < 0 && teMestres) ? "<div style='text-align:center; font-size:18px; line-height:10px;'>▲</div>" : "";
        let arrowDown = (level > 0 && teAlumnes) ? "<div style='text-align:center; font-size:18px; line-height:10px;'>▼</div>" : "";

        // Etiqueta amb fletxes dalt i baix si correspon
        let label = `${arrowUp}<b>${title}</b>${sub}\n` +
                   `${codeToEmoji(c.BIRTH_FLAG)} ${c.BIRTH_PLACE || ''} (${c.BIRTH_YEAR || '?'})\n` +
                   `${codeToEmoji(c.DEATH_FLAG)} ${c.DEATH_PLACE || ''} (${c.DEATH_YEAR || '?'})${arrowDown}`;

        nodes.push({
            id: id,
            label: label,
            shape: 'box',
            level: level,
            font: { multi: 'html', size: 14 },
            color: { 
                background: bgColor, 
                border: borderColor 
            },
            borderWidth: ((level < 0 && teMestres) || (level > 0 && teAlumnes)) ? 3 : 1,
            margin: 10
        });
    }

    // 1. Dibuixem el centre
    crearNode(rootId, 0);

  // 2. Dibuixem els mestres (Dalt)
    fullData[rootId].teachers.forEach(tId => {
        if (fullData[tId]) {
            // Si el mestre existeix al CSV, el dibuixem normal
            crearNode(tId, -1);
            edges.push({ from: tId, to: rootId, arrows: 'to', color: '#fa8c16' });
        } else {
            // Si el mestre NO existeix, creem un node de "Pendent"
            nodes.push({
                id: tId,
                label: `<b>${tId}</b>\n<i>(Pending entry)</i>`,
                shape: 'box',
                level: -1,
                font: { multi: 'html', size: 12, color: '#666666' },
                color: { background: '#eeeeee', border: '#cccccc' },
                borderDash: [5, 5], // Línia discontínua per indicar que és "fantasma"
                margin: 10
            });
            edges.push({ from: tId, to: rootId, arrows: 'to', color: '#cccccc' });
        }
    });

  // 3. Dibuixem els alumnes (Baix) - CRONOLÒGIC + ALFABÈTIC
Object.keys(fullData)
    .filter(sId => fullData[sId].teachers.includes(rootId))
    .sort((a, b) => {
        // Funció interna per treure només el número de "ca.1700" o cel·les amb text
        const parseYear = (id) => {
            const yearStr = fullData[id].BIRTH_YEAR;
            if (!yearStr || yearStr.trim() === "") return 9999; // Si està buit, al final
            const match = yearStr.match(/\d+/); // Busca el primer grup de números
            return match ? parseInt(match[0]) : 9999; // Si no hi ha números, al final
        };

        const yearA = parseYear(a);
        const yearB = parseYear(b);
        
        // Si l'any és el mateix (o tots dos són 9999), desempatem pel cognom
        if (yearA === yearB) {
            const nameA = (fullData[a].SURNAME || "").toLowerCase();
            const nameB = (fullData[b].SURNAME || "").toLowerCase();
            return nameA.localeCompare(nameB);
        }
        
        return yearA - yearB;
    })
    .forEach(sId => {
        crearNode(sId, 1);
        edges.push({ from: rootId, to: sId, arrows: 'to', color: '#52c41a' });
    });

    // Renderitzar la xarxa
    const container = document.getElementById('mynetwork');
    if (network) network.destroy();

    network = new vis.Network(container, { nodes, edges }, {
        layout: { hierarchical: { direction: 'UD', sortMethod: 'directed', levelSeparation: 150, nodeSpacing: 300 } },
        physics: false,
        interaction: { dragNodes: false, selectable: true }
    });

    // CLIC DIRECTE: Torna a la vida
    network.on("click", function(params) {
        if (params.nodes.length > 0) {
            const selectedId = params.nodes[0];
            document.getElementById('search').value = selectedId;
            draw(selectedId);
        }
    });
}
</script>
</body>
</html>

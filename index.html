<script>
let network = null;
let fullData = {};

// Funció per carregar banderes des d'un servidor extern (compatible amb Windows)
function getFlagURL(code) {
    if (!code) return null;
    const c = code.toLowerCase().trim();
    if (c === 'cat') return "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/Flag_of_Catalonia.svg/32px-Flag_of_Catalonia.svg.png";
    if (c === 'mar' || c === 'sea') return "https://cdn-icons-png.flaticon.com/32/411/411712.png";
    // Per a codis ISO (es, it, fr...)
    return `https://flagcdn.com/w40/${c}.png`;
}

Papa.parse("dades.csv", {
    download: true, header: true, skipEmptyLines: true,
    complete: function(results) { processData(results.data); }
});

function processData(data) {
    const select = document.getElementById('search');
    select.innerHTML = '<option value="">-- Selecciona un compositor --</option>';

    data.forEach(row => {
        fullData[row.ID_CODE] = {
            ...row,
            // Netegem les IDs de mestres per evitar espais en blanc
            teachers: row.STUDENT_OF ? row.STUDENT_OF.split(',').map(s => s.trim()).filter(s => s !== "") : []
        };
    });

    data.sort((a, b) => (a.SURNAME || "").localeCompare(b.SURNAME || "")).forEach(row => {
        const opt = document.createElement('option');
        opt.value = row.ID_CODE;
        opt.textContent = `${row.SURNAME}, ${row.NAME}`;
        select.appendChild(opt);
    });

    select.addEventListener('change', (e) => drawTree(e.target.value));
    if (fullData['f_pedrell']) { select.value = 'f_pedrell'; drawTree('f_pedrell'); }
}

function drawTree(rootId) {
    if (!rootId || !fullData[rootId]) return;

    const nodes = [];
    const edges = [];
    const processed = new Set();

    function build(id, level, direction) {
        if (processed.has(id + level)) return;
        processed.add(id + level);
        const comp = fullData[id];
        if (!comp) return;

        let color = '#f6ffed'; let border = '#52c41a';
        if (level === 0) { color = '#e6f7ff'; border = '#1890ff'; }
        if (level < 0) { color = '#fff7e6'; border = '#fa8c16'; }

        // Si el node encara no s'ha afegit al graf
        if (!nodes.find(n => n.id === id)) {
            const bF = getFlagURL(comp.BIRTH_FLAG);
            const dF = getFlagURL(comp.DEATH_FLAG);
            
            // Construïm l'etiqueta (sense imatges dins de l'HTML perquè vis-network no les renderitza bé en box)
            // Les banderes les posarem com a icones o text segur
            const label = `<b>${comp.NAME} ${comp.SURNAME}</b>\n` +
                          `${comp.BIRTH_PLACE || ''} (${comp.BIRTH_YEAR || '?'})\n` +
                          `${comp.DEATH_PLACE || ''} (${comp.DEATH_YEAR || '?'})`;

            nodes.push({
                id: id, label: label, level: level, shape: 'box',
                color: { background: color, border: border },
                font: { multi: 'html', size: 14, align: 'center' },
                margin: 10
            });
        }

        // MESTRES: Cap amunt
        if (direction <= 0 && level > -2) {
            comp.teachers.forEach(tId => {
                if (fullData[tId]) {
                    // Evitem duplicar línies
                    if (!edges.find(e => e.from === tId && e.to === id)) {
                        edges.push({ from: tId, to: id, arrows: 'to' });
                    }
                    build(tId, level - 1, -1);
                }
            });
        }

        // ALUMNES: Cap avall (Lògica d'ID exacta)
        if (direction >= 0 && level < 2) {
            Object.keys(fullData).forEach(sId => {
                const isStudent = fullData[sId].teachers.some(t => t === id);
                if (isStudent) {
                    if (!edges.find(e => e.from === id && e.to === sId)) {
                        edges.push({ from: id, to: sId, arrows: 'to' });
                    }
                    build(sId, level + 1, 1);
                }
            });
        }
    }

    build(rootId, 0, 0);

    const options = {
        layout: { hierarchical: { direction: 'UD', sortMethod: 'directed', levelSeparation: 150, nodeSpacing: 300 } },
        physics: false,
        interaction: { dragNodes: false }
    };

    if (network) network.destroy();
    network = new vis.Network(document.getElementById('mynetwork'), { nodes: nodes, edges: edges }, options);
    
    network.on("click", (p) => { 
        if (p.nodes.length > 0) {
            document.getElementById('search').value = p.nodes[0];
            drawTree(p.nodes[0]);
        }
    });
}
</script>

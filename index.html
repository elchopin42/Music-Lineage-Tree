<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical Lineage Tree</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f7f6; overflow-x: hidden; }
        header { background: #2c3e50; color: white; padding: 15px; text-align: center; position: relative; }
        header h1 { font-size: 1.4rem; margin: 0; display: flex; justify-content: center; align-items: center; }
        
        #controls { 
            padding: 10px; 
            background: white; 
            border-bottom: 1px solid #ccc; 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
        }

        select { padding: 8px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; }
        #search { width: 100%; max-width: 350px; }
        #mynetwork { width: 100%; height: calc(100vh - 160px); background: white; }
        label { font-weight: bold; }
        
        /* Estils per al Modal */
        #modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
        .modal-content { 
            background: white; 
            margin: 5% auto; 
            padding: 25px; 
            width: 85%; 
            max-width: 700px; 
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 12px; 
            line-height: 1.6; 
        }
        .modal-content h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .close-btn { background: #2c3e50; color: white; padding: 10px 25px; border: none; border-radius: 4px; cursor: pointer; float: right; }
        .info-icon { background: none; border: 1px solid white; color: white; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; font-size: 16px; margin-left: 10px; }

        /* AJUSTS ESPECÍFICS PER A MÒBIL */
        @media (max-width: 600px) {
            #controls { flex-direction: column; padding: 15px; }
            #label-search { display: none; } /* Ocultem "Search" per estalviar espai */
            #search { width: 100%; }
            header h1 { font-size: 1.1rem; }
            .modal-content { width: 90%; margin: 2% auto; padding: 15px; }
        }
    </style>
</head>
<body>

<header>
    <h1>Musical Lineage Tree 
        <button class="info-icon" onclick="toggleModal()">i</button>
    </h1>
</header>

<div id="controls">
    <label id="label-search" for="search">Search:</label>
    <select id="search"><option>Loading data...</option></select>
    
    <select id="lang-selector" onchange="changeLanguage(this.value)">
        <option value="en" selected>English</option>
        <option value="fr">Français</option>
        <option value="nl">Nederlands</option>
        <option value="de">Deutsch</option>
        <option value="pt">Português</option>
        <option value="es">Castellano</option>
        <option value="ca">Català</option>
        <option value="it">Italiano</option>
    </select>
</div>

<div id="modal">
    <div class="modal-content">
        <h2 id="modal-title"></h2>
        <p id="modal-intro" style="font-weight: bold;"></p>
        <ul id="modal-body"></ul>
        <button onclick="toggleModal()" id="modal-close" class="close-btn"></button>
        <div style="clear:both;"></div>
    </div>
</div>

<div id="mynetwork"></div>

<script>
const i18n = {
    en: {
        select: "-- Choose a composer --", pending: "Pending entry", search: "Search:", loading: "Loading data...",
        about_title: "Project Information", intro: "Interactive database exploring the pedagogical connections and lineage between composers and musicians through history.",
        close: "Close", rules: [
            "All names of composers and cities are in their original language.",
            "For names and places originally in Cyrillic, Arabic, or other non-Latin alphabets, English transliteration has been used.",
            "Flags refer to the current country of each city, rather than the historical state or empire to which it belonged at the time.",
            "In the case of disputed territories, the flag of the country currently in de facto control of the area has been used.",
            "Dates of birth and death for Russian composers may not be exact due to the historical use of the Julian calendar.",
            "This project only includes composers who passed away before the year 2026."
        ]
    },
    fr: {
        select: "-- Choisir un compositeur --", pending: "Entrée en attente", search: "Chercher:", loading: "Chargement...",
        about_title: "À propos du projet", intro: "Base de données interactive explorant les connexions pédagogiques et la lignée entre compositeurs et musiciens.",
        close: "Fermer", rules: [
            "Tous les noms de compositeurs et de villes sont dans leur langue d'origine.",
            "Pour les alphabets non latins, la translittération anglaise a été utilisée.",
            "Les drapeaux font référence au pays actuel de chaque ville.",
            "Pour les territoires contestés, le drapeau du contrôle de facto est utilisé.",
            "Les dates pour les Russes peuvent varier (calendrier julien).",
            "Seuls les compositeurs décédés avant 2026 sont inclus."
        ]
    },
    nl: {
        select: "-- Kies een componist --", pending: "In afwachting", search: "Zoeken:", loading: "Laden...",
        about_title: "Over het project", intro: "Interactieve database die de pedagogische verbindingen en afstamming tussen muzikanten verkent.",
        close: "Sluiten", rules: [
            "Alle namen zijn in de oorspronkelijke taal.",
            "Engelse transliteratie voor niet-Latijnse alfabetten.",
            "Vlaggen verwijzen naar het huidige land.",
            "De facto controle vlag voor betwiste gebieden.",
            "Juliaanse kalender kan data van Russen beïnvloeden.",
            "Inclusief overledenen vóór 2026."
        ]
    },
    de: {
        select: "-- Komponisten wählen --", pending: "Eintrag ausstehend", search: "Suche:", loading: "Laden...",
        about_title: "Über das Projekt", intro: "Interaktive Datenbank zur Erforschung der pädagogischen Verbindungen zwischen Musikern.",
        close: "Schließen", rules: [
            "Namen in der Originalsprache.",
            "Englische Transliteration für nicht-lateinische Schriften.",
            "Flaggen beziehen sich auf das heutige Land.",
            "De-facto-Kontrolle bei umstrittenen Gebieten.",
            "Russische Daten können aufgrund des julianischen Kalenders abweichen.",
            "Nur Komponisten, die vor 2026 verstorben sind."
        ]
    },
    pt: {
        select: "-- Escolha um compositor --", pending: "Entrada pendente", search: "Procurar:", loading: "Carregando...",
        about_title: "Sobre o Projeto", intro: "Base de dados interativa sobre conexões pedagógicas entre músicos.",
        close: "Fechar", rules: [
            "Nomes na língua original.",
            "Transliteração inglesa para alfabetos não latinos.",
            "Bandeiras do país atual.",
            "Bandeira de controlo de facto para áreas em disputa.",
            "Datas russas podem variar (calendário juliano).",
            "Apenas finados antes de 2026."
        ]
    },
    es: {
        select: "-- Elige un compositor --", pending: "Entrada pendiente", search: "Buscar:", loading: "Cargando...",
        about_title: "Sobre el Proyecto", intro: "Base de datos interactiva que explora las conexiones pedagógicas entre músicos.",
        close: "Cerrar", rules: [
            "Nombres en su idioma original.",
            "Translitesración al inglés para alfabetos no latinos.",
            "Banderas del país actual.",
            "Control de facto para territorios en disputa.",
            "Calendario juliano puede afectar fechas rusas.",
            "Solo fallecidos antes de 2026."
        ]
    },
    ca: {
        select: "-- Tria un compositor --", pending: "Entrada pendent", search: "Cerca:", loading: "Carregant...",
        about_title: "Sobre el Projecte", intro: "Base de dades interactiva que explora les connexions pedagògiques entre músics.",
        close: "Tancar", rules: [
            "Noms en l'idioma original.",
            "Transliteració a l'anglès per a alfabets no llatins.",
            "Banderes del país actual.",
            "Control de facto per a territoris en disputa.",
            "El calendari julià pot afectar dates russes.",
            "Només finats abans de 2026."
        ]
    },
    it: {
        select: "-- Scegli un compositore --", pending: "Voce in attesa", search: "Cerca:", loading: "Caricamento...",
        about_title: "Informazioni sul progetto", intro: "Database interattivo sulle connessioni pedagogiche tra musicisti.",
        close: "Chiudi", rules: [
            "Nomi in lingua originale.",
            "Traslitterazione inglese per alfabeti non latini.",
            "Bandiere del paese attuale.",
            "Controllo de facto per territori contesi.",
            "Il calendario giuliano può influire sulle date russe.",
            "Solo scomparsi prima del 2026."
        ]
    }
};

let currentLang = 'en'; 
let network = null;
let fullData = {};

function toggleModal() {
    const modal = document.getElementById('modal');
    if (modal.style.display === 'block') {
        modal.style.display = 'none';
    } else {
        document.getElementById('modal-title').textContent = i18n[currentLang].about_title;
        document.getElementById('modal-intro').textContent = i18n[currentLang].intro;
        document.getElementById('modal-close').textContent = i18n[currentLang].close;
        const list = document.getElementById('modal-body');
        list.innerHTML = "";
        i18n[currentLang].rules.forEach(rule => {
            const li = document.createElement('li');
            li.textContent = rule;
            list.appendChild(li);
        });
        modal.style.display = 'block';
    }
}

function codeToEmoji(code) {
    if (!code || code.length !== 2) return code || "";
    return code.toUpperCase().replace(/./g, char => String.fromCodePoint(char.charCodeAt(0) + 127397));
}

function changeLanguage(lang) {
    currentLang = lang;
    const select = document.getElementById('search');
    if (select.options.length <= 1) {
        select.options[0].textContent = i18n[currentLang].loading;
    } else {
        select.options[0].textContent = i18n[currentLang].select;
    }
    document.getElementById('label-search').textContent = i18n[currentLang].search;
    if (select.value && select.value !== "") draw(select.value);
}

Papa.parse("dades.csv", {
    download: true, header: true, skipEmptyLines: true,
    complete: function(results) {
        results.data.forEach(row => {
            fullData[row.ID_CODE] = {
                ...row,
                teachers: row.STUDENT_OF ? row.STUDENT_OF.split(',').map(s => s.trim()).filter(s => s) : []
            };
        });
        const select = document.getElementById('search');
        select.innerHTML = `<option value="">${i18n[currentLang].select}</option>`;
        results.data.sort((a,b) => {
            const nameA = (a.SORT_NAME || a.SURNAME || "").toLowerCase().replace(/^(de |von |van |d')/, "");
            const nameB = (b.SORT_NAME || b.SURNAME || "").toLowerCase().replace(/^(de |von |van |d')/, "");
            return nameA.localeCompare(nameB);
        }).forEach(r => {
            const opt = document.createElement('option');
            opt.value = r.ID_CODE;
            opt.textContent = r.SORT_NAME || `${r.SURNAME}, ${r.NAME}`;
            select.appendChild(opt);
        });
        select.onchange = function() { draw(this.value); };
        if (fullData['f_pedrell']) draw('f_pedrell');
    }
});

function crearNode(id, level, nodesArray) {
    const c = fullData[id];
    if (!c) return;
    const bgColor = level === 0 ? '#e6f7ff' : (level < 0 ? '#fff7e6' : '#f6ffed');
    const borderColor = level === 0 ? '#1890ff' : (level < 0 ? '#fa8c16' : '#52c41a');
    const teMestres = c.teachers && c.teachers.length > 0;
    const teAlumnes = Object.keys(fullData).some(sId => fullData[sId].teachers.includes(id));
    const title = c.DISPLAY_NAME || (c.NAME + " " + c.SURNAME);
    const sub = (c.DISPLAY_NAME && c.SURNAME && c.DISPLAY_NAME !== (c.NAME + " " + c.SURNAME)) ? `\n(${c.NAME} ${c.SURNAME})` : "";
    let indicadorDalt = (level < 0 && teMestres) ? "▲\n" : "";
    let indicadorBaix = (level > 0 && teAlumnes) ? "\n▼" : "";
    
    // Mida de font ampliada per a millor lectura en mòbil
    const fontSize = level === 0 ? 22 : 16;

    nodesArray.push({
        id: id,
        label: `${indicadorDalt}<b>${title}</b>${sub}\n` +
               `${codeToEmoji(c.BIRTH_FLAG)} ${c.BIRTH_PLACE || ''} (${c.BIRTH_YEAR || '?'})\n` +
               `${codeToEmoji(c.DEATH_FLAG)} ${c.DEATH_PLACE || ''} (${c.DEATH_YEAR || '?'})${indicadorBaix}`,
        shape: 'box', 
        level: level, 
        font: { multi: 'html', size: fontSize, align: 'center' },
        color: { background: bgColor, border: borderColor },
        borderWidth: level === 0 ? 2 : (((level < 0 && teMestres) || (level > 0 && teAlumnes)) ? 3 : 1),
        margin: 10,
        // Limitem l'amplària perquè els noms llargs salten de línia i el graf no siga tan ample
        widthConstraint: { maximum: 180 }
    });
}

function draw(rootId) {
    if (!fullData[rootId]) return;
    const nodes = [];
    const edges = [];
    crearNode(rootId, 0, nodes);
    fullData[rootId].teachers.forEach(tId => {
        if (fullData[tId]) {
            crearNode(tId, -1, nodes);
            edges.push({ from: tId, to: rootId, arrows: 'to', color: '#fa8c16' });
        } else {
            nodes.push({
                id: tId,
                label: `<b>${tId}</b>\n<i>(${i18n[currentLang].pending})</i>`,
                shape: 'box', level: -1, font: { multi: 'html', size: 14, color: '#666666' },
                color: { background: '#eeeeee', border: '#cccccc' }, borderDash: [5, 5], margin: 10,
                widthConstraint: { maximum: 180 }
            });
            edges.push({ from: tId, to: rootId, arrows: 'to', color: '#cccccc' });
        }
    });
    Object.keys(fullData).filter(sId => fullData[sId].teachers.includes(rootId)).sort((a, b) => {
        const parseYear = (id) => {
            const yearStr = fullData[id].BIRTH_YEAR;
            if (!yearStr) return 9999;
            const match = yearStr.match(/\d+/);
            return match ? parseInt(match[0]) : 9999;
        };
        const yearA = parseYear(a), yearB = parseYear(b);
        return yearA === yearB ? (fullData[a].SURNAME || "").localeCompare(fullData[b].SURNAME || "") : yearA - yearB;
    }).forEach(sId => {
        crearNode(sId, 1, nodes);
        edges.push({ from: rootId, to: sId, arrows: 'to', color: '#52c41a' });
    });
    const container = document.getElementById('mynetwork');
    if (network) network.destroy();
    network = new vis.Network(container, { nodes, edges }, {
        layout: { hierarchical: { direction: 'UD', sortMethod: 'directed', levelSeparation: 150, nodeSpacing: 250 } },
        physics: false, interaction: { dragNodes: false, selectable: true }
    });
    network.on("click", function(params) {
        if (params.nodes.length > 0) {
            const selectedId = params.nodes[0];
            if (fullData[selectedId]) {
                document.getElementById('search').value = selectedId;
                draw(selectedId);
            }
        }
    });
}
</script>
</body>
</html>
